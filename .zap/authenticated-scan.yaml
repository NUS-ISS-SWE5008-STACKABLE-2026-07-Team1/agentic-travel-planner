---
# =============================================================================
# Authenticated DAST — backlog item 13, phase 3.
#
# THE PROBLEM THIS SOLVES
# The previous scan used zaproxy/action-baseline, which replays a fixed login
# body. CSRFProtect() is enabled app-wide in flaskapp/__init__.py, so the server
# rejected that login for want of a token, ZAP did not notice, and it scanned
# every run logged out. The result was a clean report that meant nothing: it
# reached 10 public URLs and never touched a single route behind login_required.
#
# THE APPROACH: inject a real session rather than teach ZAP to log in.
# ZAP's form authentication plus anti-CSRF token handling is the part that
# reliably breaks in CI. We already have a login that works — the curl step in
# ci-dast.yml, which passes today. So that step now exports its session cookie
# and CSRF token, and the replacer job below attaches both to every request ZAP
# makes. Flask-WTF tokens last an hour, comfortably longer than this scan.
#
# THE TRADE-OFF, stated plainly for the report: the application's CSRF defence
# is BYPASSED during this scan rather than exercised. We are testing what lies
# behind authentication, not testing authentication itself. Item 13's
# authorization tests (tests/test_authorization.py) cover the access-control
# question that no scanner can answer.
# =============================================================================

env:
  contexts:
    - name: travel-planner
      urls:
        - "http://127.0.0.1:5000"
      includePaths:
        - "http://127.0.0.1:5000.*"
      excludePaths:
        # LOAD-BEARING. The spider will happily POST to /logout, which clears
        # the session server-side and leaves the rest of the scan running
        # logged out — silently producing exactly the clean, meaningless report
        # this whole file exists to stop. Do not remove.
        - "http://127.0.0.1:5000/logout"
        # Creates accounts on every visit. Noise, not coverage.
        - "http://127.0.0.1:5000/register"
      # No authentication block: the session arrives via the replacer job
      # below, already established. Telling ZAP to re-authenticate would put
      # the CSRF problem straight back.
      sessionManagement:
        method: "cookie"
  parameters:
    failOnError: true
    failOnWarning: false
    progressToStdout: true

jobs:
  # ---------------------------------------------------------------- session --
  # Attaches the session cookie and CSRF token to every outgoing request.
  # matchType req_header adds the header when absent and replaces it when
  # present, which is what we want for both.
  #
  # The values are substituted from environment variables passed into the ZAP
  # container by ci-dast.yml. They are per-run and ephemeral: the cookie belongs
  # to a throwaway CI database seeded with the demo account, and SECRET_KEY is
  # randomised per run, so nothing here is a credential worth protecting.
  - type: replacer
    parameters:
      deleteAllRules: false
    # `rules` is a SIBLING of parameters, not a child. Nesting it produces
    # "Unrecognised parameter for job replacer : rules" — one info-level line in
    # a 700-line log — and the job then runs successfully having configured
    # nothing at all. Caught only by deliberately breaking the session and
    # noticing the scan stayed green.
    rules:
        - description: "Authenticated session cookie"
          url: ".*"
          matchType: "req_header"
          matchString: "Cookie"
          matchRegex: false
          replacementString: "session=${ZAP_SESSION_COOKIE}"
          tokenProcessing: false
        # The browser reads this from a <meta name="csrf-token"> tag and sends
        # it on every state-changing /api/v1 call (static/js/app.js). Without
        # it every POST the scanner makes returns 400 and nothing is exercised.
        - description: "CSRF token for API calls"
          url: ".*"
          matchType: "req_header"
          matchString: "X-CSRFToken"
          matchRegex: false
          replacementString: "${ZAP_CSRF_TOKEN}"
          tokenProcessing: false

  - type: passiveScan-config
    parameters:
      maxAlertsPerRule: 10
      scanOnlyInScope: true

  # ------------------------------------------------------------------ seed ---
  # Why this job exists at all: the API is called from JavaScript, so a spider
  # finds almost none of it, and ZAP cannot invent valid JSON bodies unaided.
  # These requests put real, well-formed traffic into the site tree so the
  # active scanner has something to attack.
  #
  # responseCode is the canary. If the replacer above is misconfigured, the
  # session cookie never arrives, these return 401, and the plan fails loudly.
  # That is the whole point — a broken login must never degrade into a
  # clean-looking report.
  - type: requestor
    parameters:
      user: ""
    requests:
      - url: "http://127.0.0.1:5000/main"
        name: "Signed-in landing page"
        method: GET
        responseCode: 200
      - url: "http://127.0.0.1:5000/api/v1/admin/activity"
        name: "Admin monitoring (authenticated-only)"
        method: GET
        responseCode: 200
      - url: "http://127.0.0.1:5000/api/v1/travel-plans"
        name: "Submit a plan"
        method: POST
        headers:
          - "Content-Type: application/json"
        data: '{"origin":"Singapore","destination":"Japan","departure_date":"2026-09-01","return_date":"2026-09-05","travellers":1,"traveller_ages":[34],"traveller_genders":["female"],"traveller_accessibility_needs":[[]],"budget":4000,"currency":"SGD","preferences":[],"accessibility_needs":[],"refinement_notes":[]}'
      - url: "http://127.0.0.1:5000/api/v1/travel-plans/11111111-1111-4111-8111-111111111111/status"
        name: "Poll plan status"
        method: GET
      - url: "http://127.0.0.1:5000/api/v1/travel-plans/11111111-1111-4111-8111-111111111111/feedback"
        name: "Plan feedback"
        method: POST
        headers:
          - "Content-Type: application/json"
        data: '{"rating":"up","comment":"useful"}'
      - url: "http://127.0.0.1:5000/api/v1/traces/11111111-1111-4111-8111-111111111111"
        name: "Audit trace (authorization-sensitive)"
        method: GET

    # No stats test here. `stats.code.401` was tried and reported [0 == 0] while
    # a 401 was demonstrably happening on the line above it — the counter is not
    # populated at the point the test runs. The responseCode fields above are
    # the real gate: /main must answer 200 and not 302, and /admin/activity must
    # answer 200 and not 401. Both are impossible without a session.

  - type: spider
    parameters:
      context: "travel-planner"
      maxDuration: 2
      maxDepth: 5

  # The UI is JavaScript-driven, so the traditional spider alone sees very
  # little. Firefox headless ships in the ZAP stable image.
  - type: spiderAjax
    parameters:
      context: "travel-planner"
      maxDuration: 3
      browserId: "firefox-headless"

  - type: passiveScan-wait
    parameters:
      maxDuration: 3

  # ------------------------------------------------------------ active scan --
  # Time-capped deliberately. POST /api/v1/travel-plans starts a five-agent
  # LangGraph run per request, and the active scanner sends many variants of
  # every request it knows about. Uncapped, this would overrun the job's
  # timeout-minutes: 20 and be killed mid-scan, producing a partial report that
  # looks like a failure. Capped, coverage degrades gracefully and the report
  # records how far it got.
  - type: activeScan
    parameters:
      context: "travel-planner"
      maxScanDurationInMins: 8
      maxRuleDurationInMins: 2
      threadPerHost: 2

  - type: report
    parameters:
      template: "traditional-json"
      reportDir: "/zap/wrk"
      reportFile: "zap-authenticated-report.json"
      reportTitle: "Authenticated DAST"
    risks: ["info", "low", "medium", "high"]

  - type: report
    parameters:
      template: "traditional-html"
      reportDir: "/zap/wrk"
      reportFile: "zap-authenticated-report.html"
      reportTitle: "Authenticated DAST"
    risks: ["info", "low", "medium", "high"]
