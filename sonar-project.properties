# SonarCloud analysis, run from CI (ci-checks.yml, Tests job), not Automatic
# Analysis: only CI runs the tests, so only CI can hand over coverage.xml.
# Automatic Analysis must stay OFF in SonarCloud, or the CI scan fails.
sonar.projectKey=NUS-ISS-SWE5008-STACKABLE-2026-07-Team1_agentic-travel-planner
sonar.organization=nus-iss-swe5008-stackable-2026-07-team1

sonar.sources=flaskapp,scripts,deploy
sonar.tests=tests
sonar.python.version=3.11

# Written by `pytest --cov --cov-report=xml`; paths set in .coveragerc.
sonar.python.coverage.reportPaths=coverage.xml
# Browser JS, recorded from Chromium during the Playwright run
# (tests/e2e/js_coverage.py, E2E job). Paths are repo-relative.
sonar.javascript.lcov.reportPaths=coverage-js.lcov

# Data, not code. The seed modules are generated inventory tables.
sonar.exclusions=**/*.csv,**/*.sqlite3,docs/**,**/seed_data*.py

# Operational tools, out of the coverage figure only: they are still analysed
# for bugs and vulnerabilities. deploy/ runs by hand against the real cluster
# (topology proof, load and scaling tests, secrets, teardown); scripts/ holds
# one-off and live-model tools CI deliberately never runs (seed generator,
# paid evals, demos, migration). Unit tests cover the application, flaskapp/.
# The browser JavaScript is NOT excluded: it is exercised by Playwright but not
# yet measured, and hiding it would overstate coverage.
sonar.coverage.exclusions=deploy/**,scripts/**
