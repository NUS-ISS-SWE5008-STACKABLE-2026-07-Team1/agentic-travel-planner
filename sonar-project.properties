# SonarCloud analysis, run from CI (ci-checks.yml, Tests job), not Automatic
# Analysis: only CI runs the tests, so only CI can hand over coverage.xml.
# Automatic Analysis must stay OFF in SonarCloud, or the CI scan fails.
sonar.projectKey=NUS-ISS-SWE5008-STACKABLE-2026-07-Team1_agentic-travel-planner
sonar.organization=nus-iss-swe5008-stackable-2026-07-team1

sonar.sources=flaskapp,scripts,deploy
sonar.tests=tests
sonar.python.version=3.11

# Written by `pytest --cov=flaskapp --cov=scripts --cov-report=xml`.
sonar.python.coverage.reportPaths=coverage.xml

# Data, not code. The seed modules are generated inventory tables.
sonar.exclusions=**/*.csv,**/*.sqlite3,docs/**,**/seed_data*.py
