# The agents role: all four specialists served over official A2A 1.x JSON-RPC
# by scripts/a2a_server.py. Internal only — no Ingress routes here, and the
# NetworkPolicy admits nothing but the web role.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agents
  labels: {app: agents}
spec:
  # The starting count; deploy/k8s/hpa.yaml decides the rest. Tasks are still
  # in an InMemoryTaskStore, but the client makes one blocking SendMessage and
  # never polls GetTask (a2a_client.py), so a task lives and dies inside one
  # request on one pod and any replica can take any call.
  replicas: 1
  # Rolling, with a drain (below): any replica can take any call, so old and new
  # pods side by side are fine, and a deploy no longer cuts specialist calls off.
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: agents}
  template:
    metadata:
      labels: {app: agents}
      # Eviction protection is pdb.yaml, not the safe-to-evict annotation; see
      # the note in web.yaml for why.
    spec:
      # The drain: preStop sleeps 15 s while the Service stops routing here,
      # then uvicorn stops accepting and finishes the calls it is serving. A
      # specialist call is cut off by its client after 60 s anyway
      # (FLIGHT_AGENT_A2A_TIMEOUT_SECONDS), so 15 + 60 < 90.
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: agents
          image: travel-planner
          # `-m` so /app is on sys.path; `python scripts/a2a_server.py` cannot
          # import flaskapp.
          command: ["python", "-m", "scripts.a2a_server", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - {name: a2a, containerPort: 8000}
            # A2A calls in flight, for the autoscaler (flaskapp/metrics.py).
            - {name: metrics, containerPort: 9090}
          envFrom:
            - configMapRef: {name: app-config}
            - secretRef: {name: app-secrets}
          env:
            # Lets the web role's request id through, so specialist events join
            # the parent plan's audit trail instead of opening their own. Safe
            # only because networkpolicy.yaml makes web the sole caller.
            - {name: A2A_TRUST_CALLER_REQUEST_ID, value: "true"}
            - {name: METRICS_PORT, value: "9090"}
          lifecycle:
            preStop:
              sleep: {seconds: 15}
          # Measured on GKE, 2026-09-18 to 10-02 (one reading a minute): CPU
          # median 3m, p99 7m, peak 157m (a pod's first minute only); memory
          # median 142 MiB, peak 202 MiB. 384Mi keeps ~1.9x over that peak.
          # Watch for OOMKilled restarts — the restart alert covers it.
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          # The flight agent's card is served by the same process as every
          # specialist, and it is static: a cheap, dependency-free signal that
          # the A2A server is up.
          startupProbe:
            httpGet: {path: /a2a/flight_agent/.well-known/agent-card.json, port: a2a}
            periodSeconds: 5
            failureThreshold: 36
          # More tolerant than web's, from measurement. During a real four-
          # specialist plan this static card took over 5s to serve (liveness
          # and readiness both failed at 2026-09-16 16:55:35) while per-minute
          # CPU stayed under the 250m request — a short stall, likely GIL
          # contention from the specialist threads plus the A2A client's 50ms
          # GetTask polling. A restart here kills every task in flight, so
          # liveness now needs two minutes of failure, not one slow response.
          livenessProbe:
            httpGet: {path: /a2a/flight_agent/.well-known/agent-card.json, port: a2a}
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet: {path: /a2a/flight_agent/.well-known/agent-card.json, port: a2a}
            periodSeconds: 10
            timeoutSeconds: 10
