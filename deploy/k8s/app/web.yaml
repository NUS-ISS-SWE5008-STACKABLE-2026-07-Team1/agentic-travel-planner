# The web role: Flask site, REST API, job manager and orchestrator synthesis.
# All four specialists are reached over A2A at the `agents` Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: {app: web}
spec:
  # The starting count; deploy/k8s/hpa.yaml decides the rest. Job state is in
  # the planning_jobs table (jobs.py), so any replica can answer a status poll
  # for a plan running on another — the old reason for ONE (ADR-0005) is gone.
  replicas: 1
  # Rolling: the new pod is up before the old one is asked to stop, and the old
  # one drains (below), so a deploy no longer interrupts plans in progress.
  # Safe now that job state is in the database: old and new pods side by side
  # both answer every status poll.
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
      # Eviction protection is pdb.yaml, deliberately NOT the
      # `cluster-autoscaler.kubernetes.io/safe-to-evict: "false"` annotation.
      # On Autopilot that annotation makes an extended-duration pod: it raised
      # the CPU request to 500m and required a dedicated node, whose creation
      # failed on the trial's SSD_TOTAL_GB quota and left both pods Pending
      # (2026-09-17). A PodDisruptionBudget stops the same scale-down
      # evictions without either cost.
    spec:
      # The drain, end to end, when a deploy or the autoscaler removes this pod:
      #   1. preStop sleeps 15 s while the load balancer stops sending it new
      #      requests (deregistration is not instant);
      #   2. SIGTERM: gunicorn stops accepting and waits up to graceful_timeout
      #      (300 s, gunicorn.conf.py) while running plans finish — a plan takes
      #      ~3.5 min on GKE. Their status polls are answered by other pods.
      # 15 + 300 < 330. A plan still cut off is reported as WorkerLost.
      terminationGracePeriodSeconds: 330
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: travel-planner
          ports:
            - {name: http, containerPort: 8000}
            # Plans in flight, for the autoscaler (flaskapp/metrics.py). In no
            # Service, so never reachable through the Ingress.
            - {name: metrics, containerPort: 9090}
          envFrom:
            - configMapRef: {name: app-config}
            - secretRef: {name: app-secrets}
          env:
            - {name: A2A_INTERNAL_ENABLED, value: "true"}
            - {name: METRICS_PORT, value: "9090"}
          lifecycle:
            preStop:
              sleep: {seconds: 15}
          # Autopilot bills requests, so these are sized to measurement on GKE,
          # 2026-09-18 to 10-02 (one reading a minute): CPU median 7m, p99 45m,
          # above 100m only in a pod's first minute (and once in a load test,
          # a since-fixed 50 ms polling loop); memory median 130 MiB, peak
          # 181 MiB. 384Mi keeps ~2x over that peak. If Autopilot rewrites the
          # limit to equal the request, that is its policy for this cluster
          # version; watch for OOMKilled restarts.
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          # Import of langchain, the seed inventory and schema creation make
          # startup slow; this holds off liveness until the first success.
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 36
          # No dependencies: restarting cannot fix a database outage.
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          # Checks the database. GKE's load balancer derives its own health
          # check from this probe, so a DB outage takes the pod out of rotation
          # instead of serving 500s.
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
