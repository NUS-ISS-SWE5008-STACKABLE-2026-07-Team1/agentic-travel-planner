# The agents role: all four specialists served over official A2A 1.x JSON-RPC
# by scripts/a2a_server.py. Internal only — no Ingress routes here, and the
# NetworkPolicy admits nothing but the web role.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agents
  labels: {app: agents}
spec:
  # ONE. a2a_standard.py keeps tasks in an InMemoryTaskStore, and the client
  # sends SendMessage then polls GetTask. With two replicas behind the Service,
  # the poll can land on a pod that never saw the task and the specialist call
  # fails. Raise this only after tasks move into a shared store.
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: agents}
  template:
    metadata:
      labels: {app: agents}
      # Eviction protection is pdb.yaml, not the safe-to-evict annotation; see
      # the note in web.yaml for why.
    spec:
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: agents
          image: travel-planner
          # `-m` so /app is on sys.path; `python scripts/a2a_server.py` cannot
          # import flaskapp.
          command: ["python", "-m", "scripts.a2a_server", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - {name: a2a, containerPort: 8000}
          envFrom:
            - configMapRef: {name: app-config}
            - secretRef: {name: app-secrets}
          env:
            # Lets the web role's request id through, so specialist events join
            # the parent plan's audit trail instead of opening their own. Safe
            # only because networkpolicy.yaml makes web the sole caller.
            - {name: A2A_TRUST_CALLER_REQUEST_ID, value: "true"}
          # Measured locally: ~135 MiB after a plan.
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          # The flight agent's card is served by the same process as every
          # specialist, and it is static: a cheap, dependency-free signal that
          # the A2A server is up.
          startupProbe:
            httpGet: {path: /a2a/flight_agent/.well-known/agent-card.json, port: a2a}
            periodSeconds: 5
            failureThreshold: 36
          # More tolerant than web's, from measurement. During a real four-
          # specialist plan this static card took over 5s to serve (liveness
          # and readiness both failed at 2026-09-16 16:55:35) while per-minute
          # CPU stayed under the 250m request — a short stall, likely GIL
          # contention from the specialist threads plus the A2A client's 50ms
          # GetTask polling. A restart here kills every task in flight, so
          # liveness now needs two minutes of failure, not one slow response.
          livenessProbe:
            httpGet: {path: /a2a/flight_agent/.well-known/agent-card.json, port: a2a}
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet: {path: /a2a/flight_agent/.well-known/agent-card.json, port: a2a}
            periodSeconds: 10
            timeoutSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: agents
  labels: {app: agents}
spec:
  type: ClusterIP
  selector: {app: agents}
  ports:
    - {name: a2a, port: 8000, targetPort: a2a}
