# Horizontal Pod Autoscalers: 1 to 3 pods per role, scaled on WORK IN FLIGHT.
#
# History. These were created by hand for the 2026-09-19 scaling proof (CPU,
# max 3, not in git) and capped at one on 2026-10-02, because a second pod of
# either role broke plans in flight. Both causes are fixed — web's job state is
# in planning_jobs, agents' client makes one blocking call — so any pod can
# serve any request (tests/test_k8s_manifests.py re-imposes the cap if either
# regresses).
#
# Why not CPU. A plan spends nearly all its time waiting on the model: measured
# 2026-09-18 to 10-02, web p99 45m CPU, agents p99 7m. A pod running four plans
# looks idle, so CPU would never add a pod when one is needed. What fills a pod:
#
#   web     4 plans at once (jobs.MAX_CONCURRENT_PLANS); more wait in a queue.
#           Target 3 per pod: add a pod before the queue starts, not after.
#   agents  specialist calls run in asyncio's default thread pool, 12 threads
#           on these 8-CPU nodes; a plan makes up to 4 calls at once.
#           Target 8 per pod: two plans' worth, leaving headroom.
#
# Both gauges come from flaskapp/metrics.py via pod-monitoring.yaml and reach
# the HPA through the Custom Metrics Stackdriver Adapter. CPU stays as a second
# metric for request floods; the HPA follows whichever asks for more pods. If
# the adapter is missing the HPA still scales up on CPU, and never down on a
# metric it cannot read.
#
# Scale-down is deliberately slow (10-minute window, one pod per 5 minutes),
# and a removed pod drains first (web.yaml / agents.yaml): it stops taking new
# work and finishes what it is running. Scale-up is immediate, two pods a
# minute.
#
# Applied by hand with the rest of this directory (`kubectl apply -k deploy/k8s`),
# not by the pipeline, whose RBAC cannot touch autoscalers.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: web}
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Pods
      pods:
        metric: {name: "prometheus.googleapis.com|travel_planner_plans_in_flight|gauge"}
        target: {type: AverageValue, averageValue: "3"}
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 80}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies: [{type: Pods, value: 2, periodSeconds: 60}]
    scaleDown:
      stabilizationWindowSeconds: 600
      policies: [{type: Pods, value: 1, periodSeconds: 300}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agents
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: agents}
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Pods
      pods:
        metric: {name: "prometheus.googleapis.com|travel_planner_a2a_calls_in_flight|gauge"}
        target: {type: AverageValue, averageValue: "8"}
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 80}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies: [{type: Pods, value: 2, periodSeconds: 60}]
    scaleDown:
      stabilizationWindowSeconds: 600
      policies: [{type: Pods, value: 1, periodSeconds: 300}]
