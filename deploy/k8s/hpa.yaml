# Horizontal Pod Autoscalers for both roles — CAPPED AT ONE POD for now.
#
# These existed in the cluster since 2026-09-19 (created by hand for the
# scaling proof, maxReplicas 3) but were never in git. Capped on 2026-10-02
# because a second pod of either role broke plans in flight:
#
#   web     job state lived in jobs.py's module dicts, so a status poll that
#           reached the other pod got 404 while the plan still ran.
#   agents  the client polled GetTask, which could reach a pod that never saw
#           the task (tasks are in an InMemoryTaskStore).
#
# Both are fixed (state in planning_jobs; one blocking SendMessage), so the
# test no longer holds the cap. It stays at one until two more pieces land:
# a scaling signal that reflects this app's load (below), and scale-down that
# does not remove a pod mid-plan.
#
# CPU is also the wrong signal for this app: a plan spends nearly all its time
# waiting on the model. Measured 2026-09-18 to 10-02, one reading per minute:
# web p99 45m CPU, agents p99 7m; every reading above 80m except one load-test
# incident is a pod's first minute, which the autoscaler ignores. A pod is
# really full at 4 concurrent plans (jobs.py ThreadPoolExecutor), which CPU
# does not show.
#
# tests/test_k8s_manifests.py re-imposes the cap automatically if either fix
# regresses.
#
# Applied by hand with the rest of this directory (`kubectl apply -k deploy/k8s`),
# not by the pipeline, whose RBAC cannot touch autoscalers.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: web}
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 80}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agents
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: agents}
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 80}
