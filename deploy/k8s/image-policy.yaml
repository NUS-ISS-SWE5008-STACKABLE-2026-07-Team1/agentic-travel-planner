# The cluster refuses any Deployment in `travel-planner` whose image is not a
# real image from our Artifact Registry repository, named either by tag or by
# digest.
#
# Why: deploy/k8s/app/kustomization.yaml names the image with a placeholder
# (REPLACE_WITH_ARTIFACT_REGISTRY_IMAGE) that only the pipeline fills in.
# Kubernetes accepts any image name, so applying that directory by hand would
# succeed and leave a Deployment rolling out a pod that can never start. With
# this policy the API server rejects the change before any pod is touched, and
# the running version keeps serving.
#
# It checks the name only. A real-looking tag that does not exist still passes;
# the pipeline's health checks and automatic rollback cover that case, which is
# why deploys go through the pipeline.
#
# BOTH FORMS ARE ACCEPTED, and the digest form is the reason this was widened:
#
#   ...travel-planner/app:bb33640                 what deploy-gke.yml uses today
#   ...travel-planner/app@sha256:<64 hex>         what promoting a scanned image
#                                                 would use (phase 2, see
#                                                 docs/security/image-dast-experiment.md)
#
# The original pattern required `app:<tag>` and would have REFUSED a digest.
# With failurePolicy: Fail that is not a warning — the API server rejects the
# Deployment and the rollout never happens. Widening it here, ahead of the
# change that needs it, keeps that discovery out of a live deploy.
#
# The digest branch is deliberately strict: sha256 only, exactly 64 characters,
# lowercase hex. A short or uppercase digest is refused, because a reference
# that does not resolve is the same outage as a placeholder.
#
# tests/test_k8s_manifests.py extracts this CEL literal and exercises it, so the
# pattern is covered by the normal test run and does not need a cluster to check.
#
# No project-specific identity: the pattern matches any project's registry.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: travel-planner-real-images-only
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
  validations:
    - expression: >-
        object.spec.template.spec.containers.all(c,
          !c.image.contains('REPLACE_WITH_') &&
          c.image.matches('^[a-z0-9-]+-docker\\.pkg\\.dev/[^/]+/travel-planner/app(:[A-Za-z0-9._-]+|@sha256:[a-f0-9]{64})$'))
      message: >-
        Refused: the image must come from the travel-planner Artifact Registry
        repository, named by tag (app:<tag>) or by digest (app@sha256:<64 hex>).
        A REPLACE_WITH_ placeholder means deploy/k8s/app was applied by hand;
        deploys go through the pipeline.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: travel-planner-real-images-only
spec:
  policyName: travel-planner-real-images-only
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: travel-planner
