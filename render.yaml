services:
  - type: web
    name: agentic-travel-planner
    runtime: python
    plan: free
    # The branch Render auto-deploys on every push. Nothing requires this to be
    # main — point it at whichever branch is meant to be live.
    #
    # Changed from subbu-18Aug to release on 2026-08-20. release is the branch
    # the team merges into and the one CI runs on, so it is the only branch we
    # can say anything about the safety of; subbu-18Aug was one developer's
    # feature branch that happened to be live.
    #
    # THIS FILE ALONE DOES NOT MOVE THE DEPLOY. Render reads render.yaml from
    # the branch it is already watching, so a service created by hand (or still
    # pointed at subbu-18Aug) keeps its dashboard setting. Change the branch in
    # the Render dashboard too, or resync the blueprint. Until both agree, this
    # line describes an intention rather than a fact.
    branch: release
    buildCommand: pip install -r requirements.txt
    # ONE ASGI worker, deliberately. flaskapp/travel_ai/jobs.py keeps planning
    # jobs in a module-level dict, so a second worker would answer
    # GET /api/v1/travel-plans/<id>/status for a job it never ran and return 404
    # while the plan is actually running in its sibling. The planning work is
    # already on a ThreadPoolExecutor, while Uvicorn keeps serving the internal
    # A2A calls. Do not raise --workers without moving job state into the
    # planning_jobs table first.
    startCommand: >-
      uvicorn asgi:application --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Rotated per deploy by Render. Sessions do not survive a restart, which
      # is correct here — nothing depends on a stable key across deploys.
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "false"
      # Render terminates TLS, so the session cookie can and must be HTTPS-only.
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-5
      # sync: false = set by hand in the dashboard, never stored in this file.
      - key: OPENAI_API_KEY
        sync: false
      # Used only by Accessibility Agent evidence retrieval.
      - key: SERPER_API_KEY
        sync: false
      # Public origin advertised in Agent Cards and used for same-deployment
      # A2A calls, for example https://agentic-travel-planner.onrender.com.
      - key: A2A_BASE_URL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      # Supabase session pooler DSN. Set by hand in the dashboard; never here.
      - key: DATABASE_URL
        sync: false
      # The tables live outside `public`. Case-sensitive: `connect()` quotes it.
      # Leave unset to use the server default search_path.
      - key: DATABASE_SCHEMA
        value: Travelplanner_schema
      # The DSN carries no password; libpq reads PGPASSWORD from the environment.
      # Set by hand in the dashboard, like the DSN itself.
      - key: PGPASSWORD
        sync: false

      # --- L2 guardrails (the LLM classifier) ---------------------------------
      # Declared here rather than left to the code default (which is "true"),
      # because the default is also fail-closed: a classifier that cannot reach
      # the provider refuses the traveller rather than waving them through.
      # Deployed OFF until the live local test has been run once with a real
      # key. Flip to "true" here, or override it in the Render dashboard — the
      # deterministic L0/L1 gates are unaffected either way.
      - key: GUARDRAIL_LLM_ENABLED
        value: "false"
      # Per-gate models. These two values are CANDIDATES, not measurements —
      # nothing has been evaluated against a real key yet. Run
      # scripts/guardrail_eval.py and set them from the per-gate sections of
      # docs/security/guardrail-eval-report.md.
      #
      # Input: small and fast. It runs before planning with the traveller
      # waiting, and under fail-closed a timeout here is a refused request.
      - key: GUARDRAIL_INPUT_LLM_MODEL
        value: gpt-5-mini
      # Output: judges our own generated prose for ungrounded claims and bias,
      # after ~75s of planning has already elapsed. Can afford the better model.
      - key: GUARDRAIL_OUTPUT_LLM_MODEL
        value: gpt-5
      # Input gate budget.
      - key: GUARDRAIL_LLM_TIMEOUT_SECONDS
        value: "8"
      # Output gate budget, independent of the one above.
      - key: GUARDRAIL_OUTPUT_LLM_TIMEOUT_SECONDS
        value: "20"
      - key: GUARDRAIL_BLOCK_THRESHOLD
        value: "0.7"
      - key: GUARDRAIL_FAIL_MODE
        value: closed
