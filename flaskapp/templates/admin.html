<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent monitoring · Atlas AI Travel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="dashboard-body">
  <nav class="navbar bg-white border-bottom sticky-top">
    <div class="container-fluid px-lg-4 py-2">
      <a class="navbar-brand brand" href="{{ url_for('pages.main') }}"><span class="brand-mark">✦</span><span>Atlas Admin</span></a>
      <span class="small text-body-secondary">{{ user_name }}</span>
    </div>
  </nav>
  <main id="admin-monitor" class="container-fluid px-lg-4 py-4" data-endpoint="{{ url_for('travel_api.get_admin_monitoring_activity') }}">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
      <div><h1 class="h3 mb-1">Agent monitoring</h1><p class="text-body-secondary mb-0">Live request, response, and token usage overview.</p></div>
      <span id="admin-live-status" class="badge text-bg-success">Live · updating</span>
    </div>
    <div class="row g-4">
      <section class="col-xl-5" aria-labelledby="requests-heading">
        <div class="card border-0 shadow-sm admin-card">
          <div class="card-body p-0">
            <h2 id="requests-heading" class="h5 p-4 mb-0 border-bottom">Latest user requests</h2>
            <div id="admin-requests" class="list-group list-group-flush"></div>
          </div>
        </div>
      </section>
      <section class="col-xl-7" aria-labelledby="tokens-heading">
        <div class="card border-0 shadow-sm admin-card">
          <div class="card-body p-4">
            <h2 id="tokens-heading" class="h5">Tokens by agent</h2>
            <p id="selected-request-label" class="small text-body-secondary">Select a request to inspect.</p>
            <div class="admin-chart-wrap"><canvas id="agent-token-chart"></canvas></div>
          </div>
        </div>
      </section>
      <section class="col-12" aria-labelledby="responses-heading">
        <div class="card border-0 shadow-sm">
          <div class="card-body p-4">
            <h2 id="responses-heading" class="h5">Latest agent responses</h2>
            <div id="admin-agent-responses" class="row g-3 mt-1"></div>
          </div>
        </div>
      </section>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
