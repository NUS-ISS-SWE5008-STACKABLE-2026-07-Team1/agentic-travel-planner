name: Security

on:
  # Feature branches are listed explicitly rather than using '**'. This is a
  # shared repo, and enabling CI on every branch would spend minutes on other
  # people's throwaway branches without asking them. Add your branch here.
  push:
    branches: [main, release, mark, subbu-18Aug]
  # Runs the same checks on the merge result before it lands, whether the PR
  # targets a feature branch or main. NOTE: this makes the checks *run* on a
  # PR; it does not make them *required* to merge — that is a branch
  # protection setting on GitHub, not something this file can express.
  pull_request:
    branches: [main, release, mark, subbu-18Aug]
  workflow_dispatch:

# One run per branch or PR. Pushing again cancels the superseded run instead
# of queueing both, which matters because DAST alone takes ~2 minutes.
concurrency:
  group: security-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so the advisory step below can walk past commits.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          version=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # BLOCKING: no credential may exist in the checked-out tree. This is the
      # gate that stays green day to day once the tree is clean.
      - name: Gitleaks (working tree)
        run: >
          gitleaks detect --no-git --source . --redact
          --report-format sarif --report-path gitleaks-tree.sarif

      # ADVISORY: history still contains a committed Azure key (first added in
      # c309d7a). Reported, not gating, because it stays red until the history
      # is rewritten. Rotating the key is the real fix, not scrubbing history.
      - name: Gitleaks (git history)
        continue-on-error: true
        run: >
          gitleaks detect --source . --redact
          --report-format sarif --report-path gitleaks-history.sarif

      - name: Upload secret scan reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitleaks-reports
          path: gitleaks-*.sarif

  tests:
    name: Tests
    runs-on: ubuntu-latest
    # The deployed dialect. Local runs stay SQLite-only by choice, so this job
    # is the only place the Postgres code paths execute before production.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: travel_planner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # BLOCKING, unlike the scanners below. These tests are the deterministic
      # controls around a probabilistic model (safeguards, guardrails, bias
      # audit, golden scenarios) — a regression here is a safety regression.
      - name: Run pytest
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/travel_planner_test
        run: python -m pytest -q --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-report
          path: pytest-report.xml

  sast:
    name: SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install scanners
        run: python -m pip install semgrep bandit pip-audit

      # TEMP: SAST findings are reported but do not fail the build, pending team review.
      # Remove continue-on-error once we decide what should actually gate main/release.
      - name: Semgrep (static code scan)
        continue-on-error: true
        run: >
          semgrep scan --config auto --error
          --exclude-rule python.django.security.django-no-csrf-token.django-no-csrf-token
          --json --output semgrep-report.json flaskapp

      # BLOCKING, unlike the scanners around it. These are hand-written rules in
      # .semgrep/ that encode invariants the codebase already satisfies (no user
      # data in a SystemMessage, no unstructured .invoke(), no exec sink in the
      # agent package). They report zero findings today, so any finding is a new
      # violation, not pre-existing debt to triage.
      - name: Semgrep (LLM/agent rules)
        run: >
          semgrep scan --config .semgrep/ --error --metrics=off
          --json --output semgrep-llm-report.json flaskapp

      - name: Bandit (static code scan)
        continue-on-error: true
        run: bandit -r flaskapp -ll -f json -o bandit-report.json

      - name: pip-audit (dependency vulnerability scan)
        continue-on-error: true
        run: pip-audit -r requirements.txt

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sast-reports
          path: |
            semgrep-report.json
            semgrep-llm-report.json
            bandit-report.json

  dast:
    name: DAST
    needs: sast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Start app
        run: |
          nohup python app.py > app.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5000/ -o /dev/null && exit 0
            sleep 1
          done
          echo "App did not start in time"; cat app.log; exit 1

      # TEMP: DAST findings are reported but do not fail the build, pending team review.
      # Set fail_action back to true once we decide what should actually gate main/release.
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed # v0.14.0
        with:
          target: "http://127.0.0.1:5000"
          fail_action: false
          allow_issue_writing: false

      - name: Upload app log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-log
          path: app.log
