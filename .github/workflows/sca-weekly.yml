# Weekly dependency scan of the release branch.
#
# ci-checks.yml already runs pip-audit, but only when someone pushes. A
# vulnerability published on a quiet week would go unseen until the next push.
# This runs on a timer instead, against requirements.lock: the exact versions
# Render deploys.
#
# THIS FILE ONLY RUNS FROM THE DEFAULT BRANCH (main). GitHub reads `schedule`
# and the "Run workflow" button from the default branch alone, so on release
# this file does nothing until release is merged into main. That is why the
# checkout below names release explicitly: the workflow lives on main but
# scans the branch that is actually deployed.
#
# When it fails, GitHub emails whoever last changed this file's cron line.
# Fix it the same way as a pip-audit failure in ci-checks.yml: raise the
# affected version in requirements.txt and regenerate the lock, or, if no
# fixed version exists yet, add `--ignore-vuln <ID>` with a reason.

name: SCA (weekly)

on:
  schedule:
    - cron: "0 1 * * 1" # Mondays 01:00 UTC, 09:00 in Singapore
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (release)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: release

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: pip-audit (dependency vulnerability scan)
        shell: bash
        run: >
          pip-audit -r requirements.lock --require-hashes --disable-pip
          --progress-spinner off 2>&1
          | tee pip-audit-report.txt

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pip-audit-weekly
          path: pip-audit-report.txt
          retention-days: 30
