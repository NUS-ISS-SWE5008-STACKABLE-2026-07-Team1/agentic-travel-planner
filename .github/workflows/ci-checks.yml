# =============================================================================
# Replaces the secrets + tests + sast jobs of .github/workflows/security.yml.
# Split from DAST per backlog item 17: this tier runs on every push/PR, DAST
# does not (push-only, see ci-dast.yml). Addresses items 6, 7, 9, 12, 15, 17.
#
# Renamed from "CI — fast checks" (2026-09-06): "fast" was relative to DAST's
# runtime, not a claim about thoroughness, but read out of context — e.g. by
# someone reviewing the Actions tab with no prior context on why there are two
# workflows — as "the quick/shortcut tier," implying a more thorough one exists
# elsewhere. It doesn't; this file (secrets scan, tests, SAST, E2E) and
# ci-dast.yml (the dynamic scan) are the whole pipeline. Named for contents
# instead.
# =============================================================================
name: CI — Static & Functional Checks

on:
  # Item 6, and the team decision of 2026-08-17: the pipeline runs on pull
  # requests into the two shared branches. This supersedes the earlier item 17
  # decision to run the fast tier on everyone's own branch on push.
  #
  # Because a pull_request event reads its workflow files from the MERGED
  # result, this covers every PR into main or release no matter which branch it
  # came from — including branches that have never seen this file. That is the
  # whole reason this file must also exist on main.
  pull_request:
    branches: [main, release]

  # Scan every pushed branch. A workflow can only run after that branch has
  # received this file, so feature branches should regularly merge release.
  #
  # This is a tripwire, not a gate, and the distinction matters. The intended
  # control was branch protection requiring the four checks, which would make a
  # direct push to a shared branch impossible. That is a paid feature: this org
  # is on GitHub Free and the repo is private, so both rulesets and classic
  # branch protection answer
  #     403 "Upgrade to GitHub Pro or make this repository public"
  # Making the repo public is not an option — git history holds a rotated
  # credential and instance/travel_planner.sqlite3 holds traveller gender and
  # age data.
  #
  # So a direct push cannot be BLOCKED here. What this does is make one
  # visible: the pushed code is scanned and the branch goes red where the whole
  # team can see it. Replace this with real branch protection if the org ever
  # moves to GitHub Team.
  #
  # Known cost, so nobody is surprised by it: merging a pull request is itself
  # a push to the base branch, so every merge runs the pipeline a second time.
  push:
    branches: ["**"]

  # Manual runs, so this file can be exercised without opening a PR.
  workflow_dispatch:

  # LATER — push checks on everyone's own feature branch (item 17). Add these
  # names to the push list above when the team wants them:
  #     mark, andrew, andy, subbu-feature, subbu-feature-001
  # Remember that a workflow file only ever runs on the branch it physically
  # sits on, so adding a name here does nothing until that branch has merged
  # main or release and actually has this file.

permissions:
  contents: read

# Supersede in-progress runs on the same ref. Without this, three pushes in
# five minutes run three full copies of everything.
#
# head_ref is the source branch on a pull_request event and empty otherwise, so
# this keys on the branch under both event types. Using github.ref alone would
# key a PR run on refs/pull/N/merge and a push run on refs/heads/x — two
# different groups for the same commit, so neither would cancel the other once
# push triggers come back.
concurrency:
  group: fast-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10          # item 7 — was GitHub's 360-minute default
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so the advisory step below can walk past commits.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          version=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # BLOCKING: no credential may exist in the checked-out tree.
      # Green since .env.secrets was untracked. It stayed red for a while
      # before that, correctly.
      - name: Gitleaks (working tree)
        run: >
          gitleaks detect --no-git --source . --redact
          --report-format sarif --report-path gitleaks-tree.sarif

      # BLOCKING: the known credential was removed in this baseline commit.
      # Scan every change after that point so a newly committed credential can
      # never be hidden by the older, already-rotated historical finding.
      - name: Gitleaks (commits after credential-removal baseline)
        run: >
          gitleaks detect --source . --redact
          --log-opts="61ce56ee38deaf37308e74283724aef1c7a09373..HEAD"
          --report-format sarif --report-path gitleaks-new-history.sarif

      # ADVISORY by design, permanently. History contains the Azure key from
      # c309d7a and we decided not to rewrite history. Rotating the key was the
      # real fix and it has been done. Do not "fix" this by deleting the step.
      #
      # PUSH ONLY. Git history is identical between a pull request and the
      # merge it becomes, so on a PR this step re-reports the same known key
      # every single time — which is precisely how a team learns to scroll past
      # a red check. On a push to a shared branch it is a real signal.
      #
      # `always()` must stay, and must stay FIRST in the expression. Without it
      # this step is SKIPPED whenever the blocking step above fails, which is
      # how it went unnoticed for weeks: the advisory scan we believed was
      # running had never once executed. Found by an actual trial run, not by
      # reading the file. The same bug still exists in every security.yml that
      # has not yet been replaced.
      - name: Gitleaks (git history)
        if: always() && github.event_name == 'push'
        continue-on-error: true
        run: >
          gitleaks detect --source . --redact
          --report-format sarif --report-path gitleaks-history.sarif

      - name: Upload secret scan reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitleaks-reports
          path: gitleaks-*.sarif
          retention-days: 14     # item 15 — 90-day default outlives usefulness

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # ---- The deployed dialect --------------------------------------------
    # Ported from the retired security.yml, where Subbu added it alongside the
    # Supabase/Postgres migration. Keeping it matters more than it looks:
    # tests/test_database_postgres.py skips itself unless TEST_DATABASE_URL is
    # set, so without this service those tests SKIP rather than fail. The run
    # stays green, the count quietly drops, and the database we actually deploy
    # to goes untested — the same silent-pass shape as the gitleaks step that
    # never ran and the ZAP scan that was never logged in.
    #
    # Local runs stay SQLite-only by design. This job is the only place the
    # Postgres code paths execute before production.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: travel_planner_test
        ports:
          - 5432:5432
        # Without the health check the steps race the container and fail
        # intermittently on a cold runner.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      # Item 12 — install from the lockfile when it exists so two runs a week
      # apart install identical code. Falls back until requirements.lock lands.
      - name: Install dependencies
        run: |
          if [ -f requirements.lock ]; then
            echo "Installing from requirements.lock"
            python -m pip install -r requirements.lock
          else
            echo "::warning::requirements.lock missing (backlog item 12) — installing unpinned ranges"
            python -m pip install -r requirements.txt
          fi

      # BLOCKING. These are the deterministic controls around a probabilistic
      # model (safeguards, guardrails, bias audit, golden scenarios).
      #
      # `-m "not live"` deselects tests/adversarial/test_live_eval.py, the only
      # tests that call a real provider. The marker is registered in pytest.ini
      # (item 10, landed 2026-08-20); before that file existed the filter
      # worked only by accident, because pytest treats an unknown marker filter
      # as "select everything". The live evaluation is also gated a second time
      # on GUARDRAIL_LIVE_EVAL=1, so losing this flag cannot start billing CI.
      # TEST_DATABASE_URL is the switch that turns the Postgres suite on.
      # Unset locally, so a developer's run stays offline and SQLite-only; set
      # here, so the dialect that ships is never untested. psycopg is already
      # in requirements.txt.
      - name: Run pytest
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/travel_planner_test
        run: python -m pytest -q -m "not live" --junitxml=pytest-report.xml

      # Guards the port itself. Drop the service or the env var and the
      # Postgres tests go back to skipping in silence; this turns that into a
      # failure. Checks for a NON-ZERO count of executed Postgres tests, not
      # merely for the absence of skips — "no such tests" and "tests skipped"
      # are the same failure from our point of view.
      #
      # One line on purpose: a shell heredoc nested inside a YAML block scalar
      # is exactly the kind of thing that silently mangles itself.
      - name: Confirm the Postgres suite actually ran
        if: always()
        run: >-
          python -c "import xml.etree.ElementTree as ET, sys;
          r = ET.parse('pytest-report.xml').getroot();
          s = r if r.tag == 'testsuite' else r[0];
          pg = [c for c in s.iter('testcase') if 'postgres' in (c.get('classname') or '')];
          sk = [c for c in pg if c.find('skipped') is not None];
          print('postgres tests found: %d, skipped: %d' % (len(pg), len(sk)));
          sys.exit(0) if pg and not sk else
          (print('::error::Postgres suite did not run. TEST_DATABASE_URL or the service container is missing, so the database we deploy to went untested.') or sys.exit(1))"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-report
          path: pytest-report.xml
          retention-days: 14

      # ADVISORY. Writes this run's results to ci_test_runs / ci_test_results
      # in Supabase, for pass/fail history past the 14-day artifact limit. See
      # scripts/log_test_results.py and docs/handoff/ci-test-logging-supabase.md.
      #
      # Cannot fail the job: with no TEST_RESULTS_DATABASE_URL secret, an
      # unreachable database, or a bad report, it prints a notice and exits 0.
      # The secret should be an insert-only login, never the app's own
      # DATABASE_URL.
      - name: Log test results to Supabase
        if: always()
        env:
          TEST_RESULTS_DATABASE_URL: ${{ secrets.TEST_RESULTS_DATABASE_URL }}
          TEST_RESULTS_DATABASE_SCHEMA: Travelplanner_schema
        run: python scripts/log_test_results.py pytest-report.xml --job tests

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Every push+PR, same as `tests` above, on the team's own call: the
    # smoke test needs no live model (it runs against the same in-process
    # stub `ci-dast.yml` uses) and no Postgres service, so it costs a
    # `playwright install` plus a couple of seconds of test time — a few
    # extra billed minutes per run, judged worth it here for catching a
    # broken login/plan-render path before merge rather than after.
    #
    # Self-contained on purpose: no service containers, and the tests
    # themselves need no secret. Both spin up their own Flask server
    # (`tests/e2e/conftest.py`'s `live_server`) against a throwaway SQLite
    # file under pytest's own tmp_path, never `instance/travel_planner.sqlite3`.
    # (One optional secret, TEST_RESULTS_DATABASE_URL, feeds the advisory
    # logging step at the end; the tests never depend on it.)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          if [ -f requirements.lock ]; then
            python -m pip install -r requirements.lock
          else
            python -m pip install -r requirements.txt
          fi

      # Cached on Playwright's own version: the browser binary doesn't
      # change between runs unless the installed playwright version does, so a
      # cache hit skips the ~300MB Chromium download entirely. That version is
      # decided by requirements.lock, so the lock is in the key: keyed on
      # requirements.txt alone, a lock bump would restore a browser built for
      # the previous playwright and the E2E tests would fail to launch it.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.lock', 'requirements.txt') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium

      # --with-deps only installs the shared libraries the browser needs; on
      # a cache hit the browser binary itself is restored but those OS
      # packages are not, since they live outside ~/.cache/ms-playwright.
      - name: Install Chromium OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium

      # BLOCKING, same tier as `tests` above — see pytest.ini for why
      # `tests/e2e` needs `-m e2e` and its own path rather than living inside
      # the default `pytest -q` collection.
      #
      # --screenshot/--video/--tracing are pytest-playwright's own flags.
      # "only-on-failure"/"retain-on-failure" mean a clean run produces
      # nothing, so the upload below only fills in when a test fails. Added
      # because a failure used to leave only an assertion message: on
      # 2026-09-15 "Planning stopped." had to be reproduced on a laptop to see
      # what the page actually did.
      - name: Run Playwright E2E tests
        run: >-
          python -m pytest tests/e2e -m e2e --browser chromium -q
          --junitxml=e2e-report.xml
          --screenshot=only-on-failure --video=retain-on-failure --tracing=retain-on-failure

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-report
          path: e2e-report.xml
          retention-days: 14

      # Screenshots, video and trace land under test-results/, pytest-playwright's
      # default output directory. Open a trace at https://trace.playwright.dev
      # or with `playwright show-trace <file>.zip`.
      #
      # A trace records network traffic, cookies included. Safe to publish
      # here only because everything in it is throwaway: a per-run SQLite file,
      # the fixed test SECRET_KEY in tests/e2e/conftest.py, the public demo
      # account, and the stub LLM. Revisit before pointing E2E at any real
      # service or credential. if-no-files-found: ignore because a passing run
      # leaves the folder empty by design.
      - name: Upload E2E screenshots, video and trace (failures only)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-artifacts
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

      # ADVISORY, same as the step at the end of `tests`: cannot fail the job.
      - name: Log test results to Supabase
        if: always()
        env:
          TEST_RESULTS_DATABASE_URL: ${{ secrets.TEST_RESULTS_DATABASE_URL }}
          TEST_RESULTS_DATABASE_SCHEMA: Travelplanner_schema
        run: python scripts/log_test_results.py e2e-report.xml --job e2e

  sast:
    name: SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          if [ -f requirements.lock ]; then
            python -m pip install -r requirements.lock
          else
            python -m pip install -r requirements.txt
          fi

      # BLOCKING. requirements.txt is what people edit; requirements.lock is
      # what CI and Render install. This fails when the two have drifted apart,
      # instead of CI quietly testing and scanning the old versions. Runs
      # before the scanners install, so their own dependencies cannot mask it.
      - name: requirements.lock matches requirements.txt
        run: python scripts/check_requirements_lock.py

      - name: Install scanners
        run: python -m pip install semgrep bandit pip-audit

      # ADVISORY, and the team decision in item 8 recommends it stays that way:
      # registry rules change upstream with no local change on our side.
      - name: Semgrep (registry rules)
        continue-on-error: true
        run: >
          semgrep scan --config auto --error
          --exclude-rule python.django.security.django-no-csrf-token.django-no-csrf-token
          --json --output semgrep-report.json flaskapp

      # BLOCKING. Hand-written rules in .semgrep/ encoding invariants this
      # codebase already satisfies. Zero findings today, so any finding is a
      # new violation from a specific commit, not pre-existing debt.
      - name: Semgrep (LLM/agent rules)
        run: >
          semgrep scan --config .semgrep/ --error --metrics=off
          --json --output semgrep-llm-report.json flaskapp

      # Item 9 — was `-ll` (MEDIUM and above), which silently dropped every
      # LOW finding from the report. The report is an artefact, not a gate,
      # so report everything and decide gating separately under item 8.
      - name: Bandit (static code scan)
        continue-on-error: true
        run: bandit -r flaskapp -l -f json -o bandit-report.json

      # Item 12 — BLOCKING, now that requirements.lock exists. It was advisory
      # only because gating unpinned ranges meant someone else's release could
      # break our build; the lock removes that.
      #
      # --disable-pip audits the lock file as written rather than installing it
      # a second time, so it checks exactly the versions Render deploys and
      # finishes in seconds.
      #
      # If a finding has no fixed version yet and must not block merging, add
      # `--ignore-vuln <ID>` below with a comment saying why and when to
      # revisit it. Never put continue-on-error back.
      - name: pip-audit (dependency vulnerability scan)
        shell: bash
        run: >
          pip-audit -r requirements.lock --require-hashes --disable-pip
          --progress-spinner off 2>&1
          | tee pip-audit-report.txt

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sast-reports
          path: |
            semgrep-report.json
            semgrep-llm-report.json
            bandit-report.json
            pip-audit-report.txt
          retention-days: 14
