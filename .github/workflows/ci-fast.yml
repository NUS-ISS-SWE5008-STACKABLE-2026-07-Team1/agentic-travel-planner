# =============================================================================
# Replaces the secrets + tests + sast jobs of .github/workflows/security.yml.
# Split from DAST per backlog item 17: this tier is ~2 minutes, DAST is not.
# Addresses items 6, 7, 9, 12, 15, 17.
# =============================================================================
name: CI — fast checks

on:
  # Item 6, and the team decision of 2026-08-17: the pipeline runs on pull
  # requests into the two shared branches. This supersedes the earlier item 17
  # decision to run the fast tier on everyone's own branch on push.
  #
  # Because a pull_request event reads its workflow files from the MERGED
  # result, this covers every PR into main or release no matter which branch it
  # came from — including branches that have never seen this file. That is the
  # whole reason this file must also exist on main.
  pull_request:
    branches: [main, release]

  # The two shared branches on push as well, and ONLY those two.
  #
  # This is a tripwire, not a gate, and the distinction matters. The intended
  # control was branch protection requiring the four checks, which would make a
  # direct push to a shared branch impossible. That is a paid feature: this org
  # is on GitHub Free and the repo is private, so both rulesets and classic
  # branch protection answer
  #     403 "Upgrade to GitHub Pro or make this repository public"
  # Making the repo public is not an option — git history holds a rotated
  # credential and instance/travel_planner.sqlite3 holds traveller gender and
  # age data.
  #
  # So a direct push cannot be BLOCKED here. What this does is make one
  # visible: the pushed code is scanned and the branch goes red where the whole
  # team can see it. Replace this with real branch protection if the org ever
  # moves to GitHub Team.
  #
  # Known cost, so nobody is surprised by it: merging a pull request is itself
  # a push to the base branch, so every merge runs the pipeline a second time.
  push:
    branches: [main, release]

  # Manual runs, so this file can be exercised without opening a PR.
  workflow_dispatch:

  # LATER — push checks on everyone's own feature branch (item 17). Add these
  # names to the push list above when the team wants them:
  #     mark, andrew, andy, subbu-feature, subbu-feature-001
  # Remember that a workflow file only ever runs on the branch it physically
  # sits on, so adding a name here does nothing until that branch has merged
  # main or release and actually has this file.

permissions:
  contents: read

# Supersede in-progress runs on the same ref. Without this, three pushes in
# five minutes run three full copies of everything.
#
# head_ref is the source branch on a pull_request event and empty otherwise, so
# this keys on the branch under both event types. Using github.ref alone would
# key a PR run on refs/pull/N/merge and a push run on refs/heads/x — two
# different groups for the same commit, so neither would cancel the other once
# push triggers come back.
concurrency:
  group: fast-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10          # item 7 — was GitHub's 360-minute default
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so the advisory step below can walk past commits.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          version=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # BLOCKING: no credential may exist in the checked-out tree.
      # Green since .env.secrets was untracked. It stayed red for a while
      # before that, correctly.
      - name: Gitleaks (working tree)
        run: >
          gitleaks detect --no-git --source . --redact
          --report-format sarif --report-path gitleaks-tree.sarif

      # ADVISORY by design, permanently. History contains the Azure key from
      # c309d7a and we decided not to rewrite history. Rotating the key was the
      # real fix and it has been done. Do not "fix" this by deleting the step.
      #
      # PUSH ONLY. Git history is identical between a pull request and the
      # merge it becomes, so on a PR this step re-reports the same known key
      # every single time — which is precisely how a team learns to scroll past
      # a red check. On a push to a shared branch it is a real signal.
      #
      # `always()` must stay, and must stay FIRST in the expression. Without it
      # this step is SKIPPED whenever the blocking step above fails, which is
      # how it went unnoticed for weeks: the advisory scan we believed was
      # running had never once executed. Found by an actual trial run, not by
      # reading the file. The same bug still exists in every security.yml that
      # has not yet been replaced.
      - name: Gitleaks (git history)
        if: always() && github.event_name == 'push'
        continue-on-error: true
        run: >
          gitleaks detect --source . --redact
          --report-format sarif --report-path gitleaks-history.sarif

      - name: Upload secret scan reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitleaks-reports
          path: gitleaks-*.sarif
          retention-days: 14     # item 15 — 90-day default outlives usefulness

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      # Item 12 — install from the lockfile when it exists so two runs a week
      # apart install identical code. Falls back until requirements.lock lands.
      - name: Install dependencies
        run: |
          if [ -f requirements.lock ]; then
            echo "Installing from requirements.lock"
            python -m pip install -r requirements.lock
          else
            echo "::warning::requirements.lock missing (backlog item 12) — installing unpinned ranges"
            python -m pip install -r requirements.txt
          fi

      # BLOCKING. These are the deterministic controls around a probabilistic
      # model (safeguards, guardrails, bias audit, golden scenarios).
      #
      # `-m "not live"` depends on the marker registered by backlog item 10
      # (tests/conftest.py + pytest.ini). Harmless before item 10 lands —
      # pytest treats an unknown marker filter as "select everything".
      - name: Run pytest
        run: python -m pytest -q -m "not live" --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-report
          path: pytest-report.xml
          retention-days: 14

  sast:
    name: SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          if [ -f requirements.lock ]; then
            python -m pip install -r requirements.lock
          else
            python -m pip install -r requirements.txt
          fi

      - name: Install scanners
        run: python -m pip install semgrep bandit pip-audit

      # ADVISORY, and the team decision in item 8 recommends it stays that way:
      # registry rules change upstream with no local change on our side.
      - name: Semgrep (registry rules)
        continue-on-error: true
        run: >
          semgrep scan --config auto --error
          --exclude-rule python.django.security.django-no-csrf-token.django-no-csrf-token
          --json --output semgrep-report.json flaskapp

      # BLOCKING. Hand-written rules in .semgrep/ encoding invariants this
      # codebase already satisfies. Zero findings today, so any finding is a
      # new violation from a specific commit, not pre-existing debt.
      - name: Semgrep (LLM/agent rules)
        run: >
          semgrep scan --config .semgrep/ --error --metrics=off
          --json --output semgrep-llm-report.json flaskapp

      # Item 9 — was `-ll` (MEDIUM and above), which silently dropped every
      # LOW finding from the report. The report is an artefact, not a gate,
      # so report everything and decide gating separately under item 8.
      - name: Bandit (static code scan)
        continue-on-error: true
        run: bandit -r flaskapp -l -f json -o bandit-report.json

      # Item 12 — stays advisory until requirements.lock exists. Gating an
      # unpinned tree means someone else's release breaks our build.
      - name: pip-audit (dependency vulnerability scan)
        continue-on-error: true
        run: |
          if [ -f requirements.lock ]; then
            pip-audit -r requirements.lock
          else
            pip-audit -r requirements.txt
          fi

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sast-reports
          path: |
            semgrep-report.json
            semgrep-llm-report.json
            bandit-report.json
          retention-days: 14
