# =============================================================================
# Replaces the dast job of .github/workflows/security.yml.
# Split from the fast tier per item 17 — this one is slow and expensive.
# Addresses items 7, 13 (partial), 14, 15, 17.
#
# READ THIS BEFORE REVIEWING:
# The scan is now AUTHENTICATED (item 13, phase 3). It no longer stops at the
# login page. The mechanism, and the trade-off it makes, are documented in
# .zap/authenticated-scan.yaml — read that before changing anything here.
#
# Findings stay advisory per item 8. What BLOCKS is the authentication itself:
# if ZAP scans logged out, the plan's own checks trip and the "Prove the scan
# was actually authenticated" step below fails the job. A clean report from a
# logged-out scan is the failure mode this exists to prevent.
# =============================================================================
name: CI — DAST

on:
  # Pull requests only. This is the narrowing the previous comment predicted:
  # "if the double run on every merge becomes annoying, drop the push trigger
  # HERE first and leave ci-fast.yml's in place." Authenticated scanning made
  # it annoying — this job now spiders, ajax-spiders and active-scans behind a
  # login, which is minutes rather than the 1m40s the logged-out scan took.
  #
  # What this gives up: DAST no longer forms half of the push tripwire agreed
  # on 2026-08-17. ci-fast.yml KEEPS its push trigger, so a direct push to a
  # shared branch is still scanned and still goes red — by the ~50s tier
  # instead of this one. Since branch protection is unavailable on the free
  # plan and neither tier can actually block a push, giving up the slower half
  # of a detection-only control is a fair trade for the minutes.
  pull_request:
    branches: [main, release]

  workflow_dispatch:

  # LATER — push on the shared branches, if the team wants the fuller tripwire
  # back and will pay for two authenticated scans per merge:
  # push:
  #   branches: [main, release]

permissions:
  contents: read

# head_ref on a pull_request, github.ref otherwise. Without this a PR run keys
# on refs/pull/N/merge and a push run on refs/heads/x — two groups for the same
# commit, so neither cancels the other.
concurrency:
  group: dast-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  dast:
    name: DAST
    runs-on: ubuntu-latest
    timeout-minutes: 20          # item 7

    env:
      # ---- Item 14, part 1: stop scanning a knowingly-broken build ---------
      # Was falling back to config.py's published default
      # "development-only-change-me". A random per-run key means any session
      # finding ZAP reports is about the app, not about our CI config.
      SECRET_KEY: ${{ github.run_id }}-${{ github.run_attempt }}-dast-ephemeral

      # NOTE FOR REVIEW — deliberately NOT setting SESSION_COOKIE_SECURE=true.
      # The owner notes suggested it, but the scan runs over plain HTTP on
      # 127.0.0.1. Secure cookies are only sent over HTTPS, so setting it true
      # would stop the session cookie being sent at all and break login
      # entirely. Consequence to document in the report: ZAP's "cookie without
      # Secure flag" finding is a CI artefact and must not be presented as an
      # app defect. Fixing it properly means terminating TLS in CI — not worth
      # it for this module.
      SESSION_COOKIE_SECURE: "false"

      # ---- Item 14, part 2: a stub model, never a real provider key --------
      # Without a model, POST /travel-plans fails immediately and ZAP only ever
      # sees the error path — the graph and plan-rendering code go unscanned.
      LLM_PROVIDER: openai_compatible
      LLM_API_KEY: stub-not-a-real-key
      LLM_BASE_URL: http://127.0.0.1:8081/v1
      LLM_MODEL: stub-model

      # Keep CI's database and traces out of the repo tree so nothing the app
      # writes can be swept into an artefact upload.
      DATABASE: ${{ github.workspace }}/ci-instance/travel_planner.sqlite3
      TRACE_DIR: ${{ github.workspace }}/ci-instance/traces

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          if [ -f requirements.lock ]; then
            python -m pip install -r requirements.lock
          else
            python -m pip install -r requirements.txt
          fi

      - name: Prepare CI instance directory
        run: mkdir -p ci-instance/traces

      # ---- Stub provider ---------------------------------------------------
      # See scripts/ci_stub_provider.py (also a draft in this folder).
      # UNVERIFIED: this is the piece item 14 says to budget an afternoon for.
      - name: Start stub LLM provider
        run: |
          nohup python scripts/ci_stub_provider.py > stub.log 2>&1 &
          for i in $(seq 1 15); do
            curl -sf http://127.0.0.1:8081/healthz -o /dev/null && exit 0
            sleep 1
          done
          echo "::error::Stub provider did not start"; cat stub.log; exit 1

      # No seeding step is needed. flaskapp/__init__.py -> database.init_app()
      # calls initialize() then seed_login_user() on every startup, so the
      # demo account exists even against an empty database.
      # (This corrects item 13 piece 1 in the owner notes, which assumed a
      #  seeded user was a prerequisite created by untracking the sqlite file.)
      - name: Start app
        run: |
          nohup python app.py > app.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5000/ -o /dev/null && exit 0
            sleep 1
          done
          echo "::error::App did not start in time"; cat app.log; exit 1

      # ---- Item 13, piece 4: prove a session can actually be established ---
      # BLOCKING even though the scan itself is not. Without this, a broken
      # login degrades into a clean-looking report nobody questions.
      #
      # The grep differs from the owner notes' version. form.hidden_tag()
      # renders <input id="csrf_token" name="csrf_token" type="hidden"
      # value="..."> — attributes in that order — so a pattern expecting
      # value= immediately after name= matches nothing. [^>]* bridges them.
      # This step now does double duty. It still fails loudly if a session
      # cannot be established, and it exports that session for ZAP to reuse —
      # see .zap/authenticated-scan.yaml for why we hand ZAP a working session
      # instead of teaching it to log in.
      - name: Establish a session and hand it to ZAP
        run: |
          set -euo pipefail
          token=$(curl -s -c jar http://127.0.0.1:5000/ \
            | grep -oP 'name="csrf_token"[^>]*value="\K[^"]+' | head -1)
          if [ -z "${token}" ]; then
            echo "::error::Could not extract a CSRF token from the login page"; exit 1
          fi
          curl -s -b jar -c jar -X POST http://127.0.0.1:5000/ \
            -d "csrf_token=${token}" \
            -d "email=demo@example.com" \
            -d "password=TravelDemo2026!" \
            -o /dev/null
          code=$(curl -s -b jar -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:5000/api/v1/admin/activity)
          if [ "${code}" != "200" ]; then
            echo "::error::Login failed (got ${code} from /api/v1/admin/activity)."
            echo "::error::DAST would scan unauthenticated and report a meaningless clean result."
            exit 1
          fi
          echo "Authenticated session confirmed (admin/activity -> 200)."

          # The session cookie, and a CSRF token read from an authenticated
          # page. The login form's token is bound to the pre-login session, so
          # re-read it from /main rather than reusing the one above.
          session=$(awk '$6 == "session" {print $7}' jar | tail -1)
          if [ -z "${session}" ]; then
            echo "::error::No session cookie in the jar after a successful login"; exit 1
          fi
          api_token=$(curl -s -b jar http://127.0.0.1:5000/main \
            | grep -oP 'name="csrf-token" content="\K[^"]+' | head -1)
          if [ -z "${api_token}" ]; then
            echo "::error::No csrf-token meta tag on /main"; exit 1
          fi
          # Not secrets: a throwaway CI database and a per-run random
          # SECRET_KEY. Masked anyway so they never appear in a log or artefact.
          echo "::add-mask::${session}"
          echo "::add-mask::${api_token}"
          # TEMPORARY — deliberately break the session to prove the assertion below
          # can fail. Reverted in the next commit.
          echo "ZAP_SESSION_COOKIE=deliberately-invalid-for-verification" >> "$GITHUB_ENV"
          echo "ZAP_CSRF_TOKEN=${api_token}" >> "$GITHUB_ENV"

      # Item 13 — AUTHENTICATED. Replaces action-baseline, which could only
      # ever scan logged out against a CSRF-protected app. Findings stay
      # advisory per item 8; the *authentication* is what blocks, via the
      # requestor responseCode checks and the 401 statistic test in the plan.
      - name: ZAP authenticated scan (Automation Framework)
        uses: zaproxy/action-af@d186d5d9536d0f1380e5eaa58168432fefc8ed6d # v0.3.0
        continue-on-error: true
        with:
          plan: ".zap/authenticated-scan.yaml"
          docker_env_vars: |
            ZAP_SESSION_COOKIE=${{ env.ZAP_SESSION_COOKIE }}
            ZAP_CSRF_TOKEN=${{ env.ZAP_CSRF_TOKEN }}

      # BLOCKING, and the reason this rework was worth doing.
      #
      # The failure mode being guarded against is not "the scan found nothing".
      # It is "the scan silently ran logged out and therefore found nothing",
      # which looks identical from the outside and is what the old baseline job
      # did on every single run. If the report does not show that ZAP reached
      # URLs which only exist behind a session, the result is not evidence of
      # anything and must not be presented as coverage.
      - name: Prove the scan was actually authenticated
        if: always()
        run: |
          set -euo pipefail
          report=$(find . -name 'zap-authenticated-report.json' | head -1)
          if [ -z "${report}" ]; then
            echo "::error::ZAP produced no JSON report — the scan did not complete."
            exit 1
          fi
          # The traditional-json report exposes URLs only through alert
          # instances, which is why the plan asks for info-level risks too:
          # every page raises at least an informational alert, so this is a
          # usable view of where ZAP actually went.
          urls=$(jq -r '[.site[]?.alerts[]?.instances[]?.uri] | unique[]?' "${report}")
          echo "--- URLs ZAP reached ---"
          echo "${urls}"

          if [ -z "${urls}" ]; then
            echo "::error::The report contains no URLs at all."
            echo "::error::Either the scan never ran, or the report template changed."
            exit 1
          fi

          # /main, /admin, /chat and everything under /api/v1 sit behind
          # login_required or the API blueprint's session guard. Reaching any of
          # them is proof the session survived into ZAP's own traffic, which is
          # the one thing the old baseline job could never demonstrate.
          if ! echo "${urls}" | grep -qE '/(api/v1|main|admin|chat)'; then
            echo "::error::No authenticated URL appears in the ZAP report."
            echo "::error::The scan ran logged out, so a clean result here means nothing."
            echo "::error::See .zap/authenticated-scan.yaml and backlog item 13."
            exit 1
          fi
          echo "Authenticated URLs present; the scan had a working session."

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zap-authenticated-reports
          path: |
            **/zap-authenticated-report.json
            **/zap-authenticated-report.html
          retention-days: 14
          if-no-files-found: warn

      # ---- Item 15: check what we are about to publish ---------------------
      # service.py log_payload() writes whole user submissions to stdout and
      # this job captures stdout into app.log. Artefacts are downloadable by
      # anyone with repo read access.
      - name: Check app log for leaked material
        if: always()
        run: |
          if grep -REn "sk-[A-Za-z0-9]{16,}|api[_-]?key['\"]?[[:space:]]*[:=][[:space:]]*\S{16,}" app.log; then
            echo "::error::Credential-shaped string found in app.log; refusing to upload."
            exit 1
          fi
          echo "No credential-shaped strings found in app.log."

      - name: Upload app log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-log
          path: app.log
          retention-days: 14     # item 15 — was the 90-day default
