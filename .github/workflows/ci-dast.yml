# =============================================================================
# Replaces the dast job of .github/workflows/security.yml.
# Split from ci-checks.yml per item 17 — this one is slow and expensive.
# Addresses items 7, 13 (partial), 14, 15, 17.
#
# READ THIS BEFORE REVIEWING:
# The scan is now AUTHENTICATED (item 13, phase 3). It no longer stops at the
# login page. The mechanism, and the trade-off it makes, are documented in
# .zap/authenticated-scan.yaml — read that before changing anything here.
#
# Findings stay advisory per item 8. What FAILS THE JOB is the authentication
# itself: if ZAP scans logged out, the plan's own checks trip and the "Prove the
# session survived the scan" step below fails. A clean report from a logged-out
# scan is the failure mode this exists to prevent.
#
# Note the wording. Nothing here BLOCKS anything — see the trigger note below.
# =============================================================================
name: CI — DAST

on:
  # PUSH ONLY, on the two shared branches. Team decision, 2026-08-18, and it
  # reverses the pull-request-only choice made in PR #13 the day before.
  #
  # The reasoning that changed it: a pull_request run cannot BLOCK anything
  # here. Branch protection — the setting that refuses a merge until named
  # checks pass — is a paid feature, and this org is on GitHub Free with a
  # private repo. So a red PR check is a note on a screen that anyone can merge
  # straight past. Earlier comments in this repo described PR checks as
  # "gating"; that was wrong, and this note exists so nobody believes it again.
  #
  # Given nothing blocks either way, push is the more complete of the two:
  #   - merging a pull request IS a push to the base branch, so this catches
  #     everything that lands;
  #   - it also catches a direct push, which a pull_request trigger never sees.
  #
  # What we give up: finding a DAST problem before it reaches the shared branch
  # rather than after. Judged an acceptable trade for this job specifically,
  # because the authenticated scan costs ~5m40s and running it on both events
  # pays that twice for every merge.
  #
  # ci-checks.yml deliberately keeps BOTH triggers. It is ~2 minutes, and
  # failing tests are worth knowing about before you merge, not after.
  push:
    branches: [main, release]

  workflow_dispatch:

  # Consequence to expect: DAST no longer appears as a check on pull requests.
  # A PR will show three checks, not four. That is this decision working, not a
  # broken pipeline. If branch protection ever becomes available, add
  # pull_request back FIRST — a required check that never runs on a PR would
  # block every merge forever.

permissions:
  contents: read

# head_ref on a pull_request, github.ref otherwise. Without this a PR run keys
# on refs/pull/N/merge and a push run on refs/heads/x — two groups for the same
# commit, so neither cancels the other.
concurrency:
  group: dast-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  dast:
    name: DAST
    runs-on: ubuntu-latest
    timeout-minutes: 20          # item 7

    env:
      # ---- Item 14, part 1: stop scanning a knowingly-broken build ---------
      # Was falling back to config.py's published default
      # "development-only-change-me". A random per-run key means any session
      # finding ZAP reports is about the app, not about our CI config.
      SECRET_KEY: ${{ github.run_id }}-${{ github.run_attempt }}-dast-ephemeral

      # NOTE FOR REVIEW — deliberately NOT setting SESSION_COOKIE_SECURE=true.
      # The owner notes suggested it, but the scan runs over plain HTTP on
      # 127.0.0.1. Secure cookies are only sent over HTTPS, so setting it true
      # would stop the session cookie being sent at all and break login
      # entirely. Consequence to document in the report: ZAP's "cookie without
      # Secure flag" finding is a CI artefact and must not be presented as an
      # app defect. Fixing it properly means terminating TLS in CI — not worth
      # it for this module.
      SESSION_COOKIE_SECURE: "false"
      DAST_LOGIN_EMAIL: browser-scan@example.com

      # ---- Item 14, part 2: a stub model, never a real provider key --------
      # Without a model, POST /travel-plans fails immediately and ZAP only ever
      # sees the error path — the graph and plan-rendering code go unscanned.
      LLM_PROVIDER: openai_compatible
      LLM_API_KEY: stub-not-a-real-key
      LLM_BASE_URL: http://127.0.0.1:8081/v1
      LLM_MODEL: stub-model

      # Keep CI's database and traces out of the repo tree so nothing the app
      # writes can be swept into an artefact upload.
      DATABASE: ${{ github.workspace }}/ci-instance/travel_planner.sqlite3
      TRACE_DIR: ${{ github.workspace }}/ci-instance/traces

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          if [ -f requirements.lock ]; then
            python -m pip install -r requirements.lock
          else
            python -m pip install -r requirements.txt
          fi

      - name: Prepare CI instance directory
        run: mkdir -p ci-instance/traces

      - name: Generate ephemeral login credential
        run: |
          password=$(python -c 'import secrets; print(secrets.token_urlsafe(24))')
          password_hash=$(DAST_PASSWORD="$password" python -c 'import os; from werkzeug.security import generate_password_hash; print(generate_password_hash(os.environ["DAST_PASSWORD"]))')
          echo "::add-mask::$password"
          echo "E2E_LOGIN_EMAIL=$DAST_LOGIN_EMAIL" >> "$GITHUB_ENV"
          echo "E2E_LOGIN_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "LOGIN_EMAIL=$DAST_LOGIN_EMAIL" >> "$GITHUB_ENV"
          echo "LOGIN_PASSWORD_HASH=$password_hash" >> "$GITHUB_ENV"

      # ---- Stub provider ---------------------------------------------------
      # See scripts/ci_stub_provider.py (also a draft in this folder).
      # UNVERIFIED: this is the piece item 14 says to budget an afternoon for.
      - name: Start stub LLM provider
        run: |
          nohup python scripts/ci_stub_provider.py > stub.log 2>&1 &
          for i in $(seq 1 15); do
            curl -sf http://127.0.0.1:8081/healthz -o /dev/null && exit 0
            sleep 1
          done
          echo "::error::Stub provider did not start"; cat stub.log; exit 1

      # LOGIN_EMAIL and a per-run password hash were placed in GITHUB_ENV
      # above, so startup seeds an isolated account without publishing a
      # reusable credential in this workflow.
      - name: Start app
        run: |
          nohup python app.py > app.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5000/ -o /dev/null && exit 0
            sleep 1
          done
          echo "::error::App did not start in time"; cat app.log; exit 1

      # ---- Item 13, piece 4: prove a session can actually be established ---
      # BLOCKING even though the scan itself is not. Without this, a broken
      # login degrades into a clean-looking report nobody questions.
      #
      # The grep differs from the owner notes' version. form.hidden_tag()
      # renders <input id="csrf_token" name="csrf_token" type="hidden"
      # value="..."> — attributes in that order — so a pattern expecting
      # value= immediately after name= matches nothing. [^>]* bridges them.
      # This step now does double duty. It still fails loudly if a session
      # cannot be established, and it exports that session for ZAP to reuse —
      # see .zap/authenticated-scan.yaml for why we hand ZAP a working session
      # instead of teaching it to log in.
      - name: Establish a session and hand it to ZAP
        run: |
          set -euo pipefail
          token=$(curl -s -c jar http://127.0.0.1:5000/ \
            | grep -oP 'name="csrf_token"[^>]*value="\K[^"]+' | head -1)
          if [ -z "${token}" ]; then
            echo "::error::Could not extract a CSRF token from the login page"; exit 1
          fi
          curl -s -b jar -c jar -X POST http://127.0.0.1:5000/ \
            -d "csrf_token=${token}" \
            -d "email=${DAST_LOGIN_EMAIL}" \
            -d "password=${E2E_LOGIN_PASSWORD}" \
            -o /dev/null
          code=$(curl -s -b jar -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:5000/api/v1/admin/activity)
          if [ "${code}" != "200" ]; then
            echo "::error::Login failed (got ${code} from /api/v1/admin/activity)."
            echo "::error::DAST would scan unauthenticated and report a meaningless clean result."
            exit 1
          fi
          echo "Authenticated session confirmed (admin/activity -> 200)."

          # The session cookie, and a CSRF token read from an authenticated
          # page. The login form's token is bound to the pre-login session, so
          # re-read it from /main rather than reusing the one above.
          session=$(awk '$6 == "session" {print $7}' jar | tail -1)
          if [ -z "${session}" ]; then
            echo "::error::No session cookie in the jar after a successful login"; exit 1
          fi
          api_token=$(curl -s -b jar http://127.0.0.1:5000/main \
            | grep -oP 'name="csrf-token" content="\K[^"]+' | head -1)
          if [ -z "${api_token}" ]; then
            echo "::error::No csrf-token meta tag on /main"; exit 1
          fi
          # Not secrets: a throwaway CI database and a per-run random
          # SECRET_KEY. Masked anyway so they never appear in a log or artefact.
          echo "::add-mask::${session}"
          echo "::add-mask::${api_token}"
          echo "ZAP_SESSION_COOKIE=${session}" >> "$GITHUB_ENV"
          echo "ZAP_CSRF_TOKEN=${api_token}" >> "$GITHUB_ENV"

      # Item 13 — AUTHENTICATED. Replaces action-baseline, which could only
      # ever scan logged out against a CSRF-protected app. Findings stay
      # advisory per item 8; the *authentication* is what blocks, via the
      # requestor responseCode checks and the 401 statistic test in the plan.
      # Render the two placeholders into the plan before ZAP sees it.
      #
      # The obvious approach — passing them as docker_env_vars and letting the
      # Automation Framework expand ${ZAP_SESSION_COOKIE} — does not work here.
      # ZAP logged the rule as
      #     replacementString = session=${ZAP_SESSION_COOKIE}
      # with the placeholder intact, so every request carried a literal dollar
      # sign as its session and the scan ran logged out. Substituting here is
      # one sed instead of a dependency on the action's env plumbing.
      #
      # The rendered file holds an ephemeral cookie for a throwaway CI database
      # and is never uploaded: the artifact step below globs only the ZAP
      # reports.
      - name: Render the scan plan
        run: |
          set -euo pipefail
          sed -i \
            -e "s|\${ZAP_SESSION_COOKIE}|${ZAP_SESSION_COOKIE}|g" \
            -e "s|\${ZAP_CSRF_TOKEN}|${ZAP_CSRF_TOKEN}|g" \
            .zap/authenticated-scan.yaml
          if grep -q 'ZAP_SESSION_COOKIE\|ZAP_CSRF_TOKEN' .zap/authenticated-scan.yaml; then
            echo "::error::A placeholder survived rendering; ZAP would scan logged out."
            exit 1
          fi
          echo "Plan rendered."

      # NOT continue-on-error. It was, and that was wrong: it swallowed the
      # Automation Framework's own failure signal, so the requestor job's
      # responseCode mismatches (200 expected, 401 received) could not fail the
      # build. Scan FINDINGS remain advisory — the plan does not gate on alerts
      # — but the plan failing to run correctly must be loud.
      - name: ZAP authenticated scan (Automation Framework)
        uses: zaproxy/action-af@d186d5d9536d0f1380e5eaa58168432fefc8ed6d # v0.3.0
        with:
          plan: ".zap/authenticated-scan.yaml"

      # The PRIMARY gate is not here — it is the requestor job's responseCode
      # fields in .zap/authenticated-scan.yaml, which fail the plan when /main
      # answers 302 or /admin/activity answers 401. Both are impossible with a
      # working session, and the step above no longer swallows that failure.
      #
      # This step adds the one thing the plan cannot check about itself: that
      # the session was still alive when the scan finished. ZAP spidering into
      # POST /logout would end its own session part-way through and quietly
      # scan the rest logged out — which is why /logout is excluded from the
      # context, and why this verifies the exclusion actually held.
      #
      # An earlier version of this step asserted that authenticated URLs
      # appeared in the report. That assertion was worthless: the URLs appear
      # because ZAP *requested* them, whatever the response code, so it passed
      # happily against a deliberately invalid session. Recorded here because
      # it is the same class of mistake as the check it was written to prevent.
      - name: Prove the session survived the scan
        if: always()
        run: |
          set -euo pipefail
          code=$(curl -s -b jar -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:5000/api/v1/admin/activity)
          if [ "${code}" != "200" ]; then
            echo "::error::The session is dead after the scan (got ${code})."
            echo "::error::ZAP most likely reached POST /logout. Check excludePaths"
            echo "::error::in .zap/authenticated-scan.yaml — everything scanned after"
            echo "::error::that point was scanned logged out."
            exit 1
          fi
          echo "Session still valid after the scan; /logout was not reached."

          report=$(find . -name 'zap-authenticated-report.json' | head -1)
          if [ -z "${report}" ]; then
            echo "::error::ZAP produced no JSON report — the scan did not complete."
            exit 1
          fi
          # The traditional-json report exposes URLs only through alert
          # instances, which is why the plan asks for info-level risks too:
          # every page raises at least an informational alert, so this is a
          # usable view of where ZAP actually went.
          urls=$(jq -r '[.site[]?.alerts[]?.instances[]?.uri] | unique[]?' "${report}")
          echo "--- URLs ZAP reached ---"
          echo "${urls}"

          if [ -z "${urls}" ]; then
            echo "::error::The report contains no URLs at all."
            echo "::error::Either the scan never ran, or the report template changed."
            exit 1
          fi

          # Printed for the record and for the report, NOT asserted on. The
          # presence of a URL says only that ZAP sent a request to it — a
          # logged-out scan produces almost the same list, every entry a 401.
          # Whether those requests were authenticated is settled upstream by
          # the requestor responseCode checks.
          echo "For the record, ZAP reached $(echo "${urls}" | wc -l) URLs."

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zap-authenticated-reports
          path: |
            **/zap-authenticated-report.json
            **/zap-authenticated-report.html
          retention-days: 14
          if-no-files-found: warn

      # ---- Item 15: check what we are about to publish ---------------------
      # service.py log_payload() writes whole user submissions to stdout and
      # this job captures stdout into app.log. Artefacts are downloadable by
      # anyone with repo read access.
      - name: Check app log for leaked material
        if: always()
        run: |
          if grep -REn "sk-[A-Za-z0-9]{16,}|api[_-]?key['\"]?[[:space:]]*[:=][[:space:]]*\S{16,}" app.log; then
            echo "::error::Credential-shaped string found in app.log; refusing to upload."
            exit 1
          fi
          echo "No credential-shaped strings found in app.log."

      - name: Upload app log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-log
          path: app.log
          retention-days: 14     # item 15 — was the 90-day default
