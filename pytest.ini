[pytest]
testpaths = tests
markers =
    live: hits a real model provider. Excluded from CI by `-m "not live"`.

# The `live` marker is what splits the two guardrail tiers (UR-075):
# the deterministic corpus runs on every PR and blocks, while the model
# evaluation is scheduled and never blocks, because model output is
# non-deterministic and a flaky merge gate teaches people to ignore red.
#
# `.github/workflows/ci-fast.yml` already runs `pytest -q -m "not live"`.
# Until this file existed the marker was unregistered, so that filter worked
# only by accident and emitted a PytestUnknownMarkWarning on every run.
